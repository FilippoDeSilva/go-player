name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      LIBRARY_PATH: /opt/homebrew/lib
      DYLD_FALLBACK_LIBRARY_PATH: /opt/homebrew/lib
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libmpv-dev

      - name: Install mpv (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv

      - run: pnpm install --frozen-lockfile

      - name: Provision libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PAT: ${{ secrets.PAT }}
        run: ./scripts/setup-mpv.ps1 -Version v0.42.0

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseCommitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          # Optional updater signing — set these repo secrets to enable
          # signed updater artifacts:
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
