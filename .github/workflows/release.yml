name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check for new version
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version changed since last tag
        id: check
        run: |
          # Get version from Cargo.toml
          VERSION=$(grep '^version' apps/app/src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)

          # Get latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          LATEST_VERSION=${LATEST_TAG#v}

          echo "Current version: $VERSION"
          echo "Latest tag: $LATEST_TAG ($LATEST_VERSION)"

          if [ "$VERSION" != "$LATEST_VERSION" ]; then
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "New version detected: $VERSION (latest tag: $LATEST_VERSION)"
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "No new version (version matches latest tag)"
          fi

  create-tag:
    name: Create release tag and notes
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_notes: ${{ steps.notes.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Go Player - Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          awk -v ver="$VERSION" '
            /^## \[/ { in_section = ($0 ~ "\\[" ver "\\]") }
            in_section { print }
          ' CHANGELOG.md > release_notes.md
          # Add all screenshots from docs/screenshots/ dynamically
          # Supports common image formats: png, jpg, jpeg, webp, gif
          shopt -s nullglob
          for img in docs/screenshots/*.{png,jpg,jpeg,webp,gif}; do
            filename=$(basename "$img")
            name="${filename%.*}"
            echo "![${name}](https://raw.githubusercontent.com/${{ github.repository }}/v${VERSION}/docs/screenshots/${filename})" >> release_notes.md
            echo "" >> release_notes.md
          done
          # Store in output using heredoc for multi-line content
          {
            echo "release_notes<<EOF"
            cat release_notes.md
            echo "EOF"
          } >> $GITHUB_OUTPUT

  build:
    name: Build (${{ matrix.os }})
    needs: [check-version, create-tag]
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      LIBRARY_PATH: /opt/homebrew/lib
      DYLD_FALLBACK_LIBRARY_PATH: /opt/homebrew/lib
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.check-version.outputs.version }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies (Tauri + native mpv build)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf \
            build-essential git meson ninja-build pkg-config yasm nasm python3-pip \
            libva-dev libx11-dev libxcb1-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libxcb-xkb-dev libxcb-xinerama0-dev libxcb-cursor-dev libxext-dev \
            libxfixes-dev libxrandr-dev libxrender-dev libxss-dev libxi-dev \
            libxpresent-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev wayland-protocols \
            libegl-dev libgl-dev libgles-dev libgbm-dev libdrm-dev \
            libpulse-dev libasound2-dev libudev-dev libvulkan-dev \
            libfreetype-dev libfontconfig-dev libfribidi-dev libharfbuzz-dev \
            libuchardet-dev zlib1g-dev libssl-dev libexpat-dev
          python3 -m pip install --user --upgrade meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install meson ninja nasm pkg-config

      - run: pnpm install --frozen-lockfile

      - name: Provision libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PAT: ${{ secrets.PAT }}
        run: ./scripts/setup-mpv.ps1 -Version v0.42.0

      - name: Build self-contained libmpv (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build-mpv-linux.sh

      - name: Build self-contained libmpv (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/build-mpv-macos.sh

      - name: Write release notes
        shell: bash
        env:
          RELEASE_NOTES: ${{ needs.create-tag.outputs.release_notes }}
        run: |
          printf '%s' "$RELEASE_NOTES" > release_notes.md

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: v${{ needs.check-version.outputs.version }}
          releaseName: v${{ needs.check-version.outputs.version }}
          releaseBodyPath: ./release_notes.md
          releaseCommitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          # Optional updater signing — set these repo secrets to enable
          # signed updater artifacts:
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
